<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>سامانه ارسال تکالیف آکادمی</title>
  <style>
    :root {
      --bg: #f4f7ff;
      --card: #ffffff;
      --primary: #3f51b5;
      --primary-dark: #2f3f9f;
      --text: #1f2937;
      --muted: #6b7280;
      --danger: #d32f2f;
      --success: #1b5e20;
      --border: #dbe4ff;
      font-family: Tahoma, Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: linear-gradient(180deg, #eef2ff 0%, #f8faff 100%);
      color: var(--text);
      min-height: 100vh;
      padding: 24px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      display: grid;
      gap: 20px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 8px 24px rgba(40, 57, 120, 0.08);
    }

    h1 {
      margin: 0;
      color: var(--primary-dark);
      font-size: 1.7rem;
    }

    .subtitle {
      margin: 8px 0 0;
      color: var(--muted);
      line-height: 1.8;
    }

    form {
      display: grid;
      gap: 14px;
      margin-top: 8px;
    }

    .row {
      display: grid;
      gap: 14px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    label {
      display: block;
      font-size: 0.95rem;
      margin-bottom: 6px;
      color: #374151;
      font-weight: 600;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid #c8d6ff;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.95rem;
      background: #fcfdff;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
      line-height: 1.7;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 4px;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 0.92rem;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover { background: #3546a5; }

    .btn-secondary {
      background: #e8edff;
      color: #243283;
    }

    .btn-danger {
      background: #ffe7e7;
      color: var(--danger);
    }

    .notice {
      margin-top: 8px;
      font-size: 0.93rem;
      color: var(--success);
      min-height: 1.3em;
    }

    .list-title {
      margin: 0 0 12px;
      color: #22308c;
      font-size: 1.2rem;
    }

    .submission-list {
      display: grid;
      gap: 12px;
    }

    .submission-item {
      border: 1px solid #dbe4ff;
      background: #f9fbff;
      border-radius: 10px;
      padding: 12px;
    }

    .submission-item h3 {
      margin: 0 0 8px;
      font-size: 1rem;
      color: #1f2e78;
    }

    .meta {
      margin: 0;
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.8;
    }

    .empty {
      color: var(--muted);
      margin: 0;
    }

    @media (max-width: 720px) {
      body { padding: 16px; }
      .row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="container">
    <section class="card">
      <h1>سامانه ارسال تکالیف آکادمی</h1>
      <p class="subtitle">
        دانش‌آموزان می‌توانند اطلاعات تکلیف خود را وارد کنند، فایل تمرین را انتخاب کنند و ارسال انجام دهند.
        داده‌ها در همین مرورگر ذخیره می‌شود (LocalStorage).
      </p>

      <form id="homeworkForm">
        <div class="row">
          <div>
            <label for="studentName">نام و نام خانوادگی</label>
            <input id="studentName" name="studentName" type="text" required placeholder="مثلاً: علی رضایی" />
          </div>
          <div>
            <label for="studentClass">کلاس / گروه</label>
            <input id="studentClass" name="studentClass" type="text" required placeholder="مثلاً: سطح مقدماتی - A" />
          </div>
        </div>

        <div class="row">
          <div>
            <label for="homeworkTitle">عنوان تکلیف</label>
            <input id="homeworkTitle" name="homeworkTitle" type="text" required placeholder="مثلاً: تمرین درس ۳" />
          </div>
          <div>
            <label for="deliveryDate">تاریخ ارسال</label>
            <input id="deliveryDate" name="deliveryDate" type="date" required />
          </div>
        </div>

        <div>
          <label for="description">توضیحات (اختیاری)</label>
          <textarea id="description" name="description" placeholder="اگر توضیحی دارید اینجا بنویسید..."></textarea>
        </div>

        <div>
          <label for="attachment">فایل تکلیف</label>
          <input id="attachment" name="attachment" type="file" required />
        </div>

        <div class="actions">
          <button type="submit" class="btn-primary">ارسال تکلیف</button>
          <button type="reset" class="btn-secondary">پاک کردن فرم</button>
          <button type="button" id="clearAll" class="btn-danger">حذف همه ارسال‌ها</button>
        </div>

        <p id="notice" class="notice" aria-live="polite"></p>
      </form>
    </section>

    <section class="card">
      <h2 class="list-title">تکالیف ارسال‌شده</h2>
      <div id="submissionList" class="submission-list"></div>
    </section>
  </main>

  <script>
    const STORAGE_KEY = 'academy_homework_submissions_v1';

    const form = document.getElementById('homeworkForm');
    const list = document.getElementById('submissionList');
    const notice = document.getElementById('notice');
    const clearAllButton = document.getElementById('clearAll');

    function getSubmissions() {
      return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    }

    function saveSubmissions(submissions) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(submissions));
    }

    function renderList() {
      const submissions = getSubmissions();
      if (!submissions.length) {
        list.innerHTML = '<p class="empty">هنوز هیچ تکلیفی ارسال نشده است.</p>';
        return;
      }

      list.innerHTML = submissions
        .map((item, index) => `
          <article class="submission-item">
            <h3>${index + 1}) ${item.homeworkTitle}</h3>
            <p class="meta">
              دانش‌آموز: ${item.studentName}<br>
              کلاس: ${item.studentClass}<br>
              تاریخ ارسال: ${item.deliveryDate}<br>
              فایل: ${item.fileName}<br>
              توضیحات: ${item.description || '—'}
            </p>
          </article>
        `)
        .join('');
    }

    function showNotice(message, isError = false) {
      notice.textContent = message;
      notice.style.color = isError ? 'var(--danger)' : 'var(--success)';
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();

      const data = new FormData(form);
      const file = data.get('attachment');

      if (!file || !file.name) {
        showNotice('لطفاً فایل تکلیف را انتخاب کنید.', true);
        return;
      }

      const newSubmission = {
        studentName: data.get('studentName').trim(),
        studentClass: data.get('studentClass').trim(),
        homeworkTitle: data.get('homeworkTitle').trim(),
        deliveryDate: data.get('deliveryDate'),
        description: data.get('description').trim(),
        fileName: file.name,
        createdAt: new Date().toISOString()
      };

      const submissions = getSubmissions();
      submissions.unshift(newSubmission);
      saveSubmissions(submissions);
      renderList();
      form.reset();
      showNotice('تکلیف با موفقیت ثبت شد ✅');
    });

    clearAllButton.addEventListener('click', () => {
      localStorage.removeItem(STORAGE_KEY);
      renderList();
      showNotice('همه‌ی ارسال‌ها حذف شدند.');
    });

    renderList();
  </script>
</body>
</html>
